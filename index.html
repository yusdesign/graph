<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Graph — редактор графов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0b0b0e;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #eee;
        }
        #toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 10px;
            background: #1a1a1f;
            border-bottom: 1px solid #2a2a30;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #toolbar .group {
            display: flex;
            gap: 4px;
            align-items: center;
            margin-right: 6px;
            padding-right: 6px;
            border-right: 1px solid #2a2a30;
        }
        #toolbar .group:last-child { border-right: none; }
        #toolbar button {
            background: #2c2c35;
            border: none;
            color: #ddd;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
            white-space: nowrap;
            transition: 0.1s;
        }
        #toolbar button:active { background: #3d3d4a; transform: scale(0.95); }
        #toolbar button.active { background: #5a4b8a; color: #fff; }
        #toolbar button.tool-active { background: #3a5a8a; color: #fff; }
        #toolbar .spacer { flex: 1; }
        #status {
            padding: 4px 14px;
            background: #0f0f12;
            border-top: 1px solid #1a1a20;
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        #canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #121216;
            touch-action: none;
        }
        #canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #report-panel {
            background: #14141a;
            border-top: 1px solid #2a2a30;
            padding: 8px 14px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            flex-shrink: 0;
            display: none;
            line-height: 1.5;
        }
        #report-panel .ok { color: #6f6; }
        #report-panel .warn { color: #ff8; }
        #report-panel .err { color: #f66; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1e1e26;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
        }
        .modal-box textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #eee;
            font-size: 15px;
            resize: vertical;
            min-height: 60px;
        }
        .modal-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: flex-end;
        }
        .modal-box .actions button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .modal-box .actions .save { background: #5a4b8a; color: #fff; }
        .modal-box .actions .cancel { background: #2a2a30; color: #aaa; }
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2a;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            color: #ddd;
            border: 1px solid #3a3a4a;
            display: none;
            z-index: 50;
        }
    </style>
</head>
<body>

<div id="toolbar">
    <div class="group">
        <button id="tool-select" class="tool-active">🖱️</button>
        <button id="tool-node">✏️</button>
        <button id="tool-edge">🔗</button>
        <button id="tool-delete">🗑️</button>
    </div>
    <div class="group">
        <button id="btn-graph" class="active">🌐</button>
        <button id="btn-todo">☑️</button>
        <button id="btn-text">📄</button>
    </div>
    <div class="group">
        <button id="btn-bpmn">🧩BPMN</button>
    </div>
    <span class="spacer"></span>
    <div class="group">
        <button id="btn-export">💾</button>
        <button id="btn-import">📂</button>
        <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
</div>

<div id="canvas-wrap">
    <canvas id="canvas"></canvas>
</div>

<div id="report-panel"></div>

<div id="status">
    <span id="node-count">Узлов: 0</span>
    <span id="edge-count">Связей: 0</span>
    <span id="view-label">режим: граф</span>
    <span id="tool-label">инструмент: выбрать</span>
</div>

<div id="toast"></div>

<!-- Модалка редактирования узла -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
        <textarea id="edit-textarea" placeholder="Введите текст узла..."></textarea>
        <div class="actions">
            <button class="cancel" id="edit-cancel">Отмена</button>
            <button class="save" id="edit-save">Сохранить</button>
        </div>
    </div>
</div>

<script>
(function(){
    // ----- СОСТОЯНИЕ -----
    let state = {
        nodes: [],
        edges: [],
        nextId: 1,
        viewMode: 'graph',
        tool: 'select', // 'select' | 'node' | 'edge' | 'delete'
        selectedNodeId: null,
        bpmnActive: false,
        hasDemo: false
    };

    // Восстанавливаем из localStorage
    function loadState() {
        try {
            const saved = localStorage.getItem('graph_state');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.nodes = parsed.nodes || [];
                state.edges = parsed.edges || [];
                state.nextId = parsed.nextId || 1;
                state.viewMode = parsed.viewMode || 'graph';
                state.bpmnActive = parsed.bpmnActive || false;
                state.hasDemo = true;
                return true;
            }
        } catch(e) {}
        return false;
    }

    function saveState() {
        const data = {
            nodes: state.nodes,
            edges: state.edges,
            nextId: state.nextId,
            viewMode: state.viewMode,
            bpmnActive: state.bpmnActive
        };
        localStorage.setItem('graph_state', JSON.stringify(data));
    }

    // ----- КАНВАС -----
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
        const wrap = document.getElementById('canvas-wrap');
        W = wrap.clientWidth;
        H = wrap.clientHeight;
        canvas.width = W * devicePixelRatio;
        canvas.height = H * devicePixelRatio;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.scale(devicePixelRatio, devicePixelRatio);
        render();
    }

    // ----- ЭМОДЗИ ПО ТЕКСТУ -----
    const EMOJI_MAP = {
        'начало': '🟢', 'старт': '🟢', 'start': '🟢',
        'конец': '🔴', 'end': '🔴', 'финиш': '🔴',
        'решение': '🔶', 'если': '🔶', 'choice': '🔶',
        'задача': '📋', 'task': '📋', 'сделать': '📋',
        'событие': '📌', 'event': '📌', 'произошло': '📌',
        'идея': '💡', 'idea': '💡',
        'вопрос': '❓', 'question': '❓',
        'человек': '👤', 'person': '👤',
        'деньги': '💰', 'money': '💰',
        'время': '⏰', 'time': '⏰',
        'код': '💻', 'code': '💻',
        'чувство': '❤️‍🩹', 'feeling': '❤️‍🩹'
    };

    function getEmoji(text) {
        if (!text) return '🔹';
        const lower = text.toLowerCase();
        for (const [word, emoji] of Object.entries(EMOJI_MAP)) {
            if (lower.includes(word)) return emoji;
        }
        return '🔹';
    }

    // ----- РЕНДЕРИНГ -----
    function render() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#121216';
        ctx.fillRect(0, 0, W, H);

        if (state.viewMode === 'graph') drawGraph();
        else if (state.viewMode === 'todo') drawTodo();
        else if (state.viewMode === 'text') drawText();

        document.getElementById('node-count').textContent = 'Узлов: ' + state.nodes.length;
        document.getElementById('edge-count').textContent = 'Связей: ' + state.edges.length;
        document.getElementById('view-label').textContent = 'режим: ' + state.viewMode + (state.bpmnActive ? ' (BPMN)' : '');
        document.getElementById('tool-label').textContent = 'инструмент: ' + state.tool;

        saveState();
    }

    function drawGraph() {
        // Рёбра
        ctx.lineWidth = 2;
        for (const e of state.edges) {
            const from = state.nodes.find(n => n.id === e.from);
            const to = state.nodes.find(n => n.id === e.to);
            if (!from || !to) continue;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            if (e.type === 'mystery') {
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = '#aa88ff';
            } else {
                ctx.setLineDash([]);
                ctx.strokeStyle = state.bpmnActive ? '#ffaa44' : '#5588dd';
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Узлы
        for (const n of state.nodes) {
            const r = 28;
            const emoji = getEmoji(n.content);
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);

            let fill = '#2a2a35';
            let stroke = '#5a6a8a';
            if (state.bpmnActive) {
                if (n._bpmnStatus === 'ok') { fill = '#1a3a1a'; stroke = '#4caf50'; }
                else if (n._bpmnStatus === 'warn') { fill = '#3a3a1a'; stroke = '#ffeb3b'; }
                else if (n._bpmnStatus === 'err') { fill = '#3a1a1a'; stroke = '#f44336'; }
            }
            // Подсветка выбранного
            if (state.selectedNodeId === n.id) {
                stroke = '#88ddff';
                ctx.shadowColor = '#88ddff';
                ctx.shadowBlur = 15;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(emoji, n.x, n.y - 14);

            ctx.font = '10px system-ui, sans-serif';
            ctx.fillStyle = '#ccc';
            const label = (n.content || 'узел').slice(0, 16) + ((n.content || '').length > 16 ? '…' : '');
            ctx.fillText(label, n.x, n.y + 18);
        }
    }

    function drawTodo() {
        const startY = 60;
        let y = startY;
        ctx.fillStyle = '#eaeaea';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textBaseline = 'top';
        for (const n of state.nodes) {
            ctx.fillStyle = '#c8c8d0';
            ctx.fillText('○ ' + (n.content || 'пусто'), 30, y);
            y += 40;
            if (y > H - 40) break;
        }
        if (state.nodes.length === 0) {
            ctx.fillStyle = '#444';
            ctx.fillText('Нет элементов. Переключись в Граф и добавь.', 30, startY);
        }
    }

    function drawText() {
        const startY = 60;
        let y = startY;
        ctx.fillStyle = '#d0d0da';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textBaseline = 'top';
        const text = state.nodes.map(n => n.content).filter(Boolean).join(' ');
        ctx.fillText(text || '— пусто —', 24, y);
        if (text.length === 0) {
            ctx.fillStyle = '#444';
            ctx.fillText('Нет текста. Добавь узлы в режиме Граф.', 24, startY);
        }
    }

    // ----- BPMN -----
    function applyBPMN() {
        const report = document.getElementById('report-panel');
        let html = '<b>🧾 Отчёт по BPMN:</b><br>';
        state.nodes.forEach(n => delete n._bpmnStatus);

        const hasStart = state.nodes.some(n => (n.content || '').toLowerCase().includes('начало') || (n.content || '').toLowerCase().includes('старт'));
        if (!hasStart && state.nodes.length > 0) {
            html += '<span class="warn">⚠️ Нет стартового события. Первый узел будет считаться стартовым.</span><br>';
            state.nodes[0]._bpmnStatus = 'warn';
        }

        const hasEnd = state.nodes.some(n => (n.content || '').toLowerCase().includes('конец') || (n.content || '').toLowerCase().includes('финиш'));
        if (!hasEnd && state.nodes.length > 0) {
            html += '<span class="warn">⚠️ Нет конечного события. Последний узел будет считаться конечным.</span><br>';
            state.nodes[state.nodes.length-1]._bpmnStatus = 'warn';
        }

        for (const n of state.nodes) {
            const hasIn = state.edges.some(e => e.to === n.id);
            const hasOut = state.edges.some(e => e.from === n.id);
            if (!hasIn && !hasOut) {
                html += `<span class="err">🔴 Узел "${n.content || 'без имени'}" (id:${n.id}) изолирован.</span><br>`;
                n._bpmnStatus = 'err';
            } else if (!hasIn && hasOut && n._bpmnStatus !== 'err' && n._bpmnStatus !== 'warn') {
                html += `<span class="warn">⚠️ Узел "${n.content || 'без имени'}" не имеет входящих потоков. Будет стартовым.</span><br>`;
                n._bpmnStatus = 'warn';
            } else if (!hasOut && hasIn && n._bpmnStatus !== 'err' && n._bpmnStatus !== 'warn') {
                html += `<span class="warn">⚠️ Узел "${n.content || 'без имени'}" не имеет исходящих потоков. Будет конечным.</span><br>`;
                n._bpmnStatus = 'warn';
            } else if (n._bpmnStatus !== 'err' && n._bpmnStatus !== 'warn') {
                n._bpmnStatus = 'ok';
            }
        }

        const okCount = state.nodes.filter(n => n._bpmnStatus === 'ok').length;
        const warnCount = state.nodes.filter(n => n._bpmnStatus === 'warn').length;
        const errCount = state.nodes.filter(n => n._bpmnStatus === 'err').length;
        html += `<br><span class="ok">✅ Интерпретировано: ${okCount}</span>`;
        if (warnCount) html += `, <span class="warn">⚠️ ${warnCount} с предупреждениями</span>`;
        if (errCount) html += `, <span class="err">🔴 ${errCount} с ошибками</span>`;
        html += '.';

        report.innerHTML = html;
        report.style.display = 'block';
        state.bpmnActive = true;
        render();
    }

    function clearBPMN() {
        document.getElementById('report-panel').style.display = 'none';
        state.nodes.forEach(n => delete n._bpmnStatus);
        state.bpmnActive = false;
        render();
    }

    // ----- ВЗАИМОДЕЙСТВИЕ С ХОЛСТОМ -----
    let dragTarget = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let edgeStartNode = null;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return {
            x: (t.clientX - rect.left) * (W / rect.width),
            y: (t.clientY - rect.top) * (H / rect.height)
        };
    }

    function getNodeAt(pos) {
        return state.nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 30);
    }

    function onStart(e) {
        e.preventDefault();
        if (state.viewMode !== 'graph') return;
        const pos = getPos(e);
        const hit = getNodeAt(pos);

        if (state.tool === 'select') {
            if (hit) {
                state.selectedNodeId = hit.id;
                dragTarget = hit;
                dragOffsetX = pos.x - hit.x;
                dragOffsetY = pos.y - hit.y;
                render();
            } else {
                state.selectedNodeId = null;
                render();
            }
        } else if (state.tool === 'node') {
            if (!hit) {
                const id = state.nextId++;
                state.nodes.push({ id, x: pos.x, y: pos.y, content: 'узел ' + id });
                state.selectedNodeId = id;
                render();
                // Открываем редактирование
                setTimeout(() => openEditor(id), 100);
            }
        } else if (state.tool === 'edge') {
            if (hit) {
                edgeStartNode = hit;
                state.selectedNodeId = hit.id;
                render();
            }
        } else if (state.tool === 'delete') {
            if (hit) {
                // Удаляем узел и все связи с ним
                state.edges = state.edges.filter(e => e.from !== hit.id && e.to !== hit.id);
                state.nodes = state.nodes.filter(n => n.id !== hit.id);
                state.selectedNodeId = null;
                if (state.bpmnActive) clearBPMN();
                render();
                showToast('🗑️ Узел удалён');
            }
        }
    }

    function onMove(e) {
        e.preventDefault();
        const pos = getPos(e);

        if (state.tool === 'select' && dragTarget) {
            dragTarget.x = Math.min(W - 10, Math.max(10, pos.x - dragOffsetX));
            dragTarget.y = Math.min(H - 10, Math.max(10, pos.y - dragOffsetY));
            render();
        }

        // Визуализация рисования связи
        if (state.tool === 'edge' && edgeStartNode) {
            render();
            ctx.beginPath();
            ctx.moveTo(edgeStartNode.x, edgeStartNode.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#88aadd88';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function onEnd(e) {
        e.preventDefault();
        const pos = getPos(e);

        if (state.tool === 'edge' && edgeStartNode) {
            const hit = getNodeAt(pos);
            if (hit && hit.id !== edgeStartNode.id) {
                state.edges.push({
                    id: state.nextId++,
                    from: edgeStartNode.id,
                    to: hit.id,
                    type: 'logical'
                });
                if (state.bpmnActive) clearBPMN();
                render();
                showToast('🔗 Связь создана');
            }
            edgeStartNode = null;
            state.selectedNodeId = null;
            render();
        }

        dragTarget = null;
    }

    // ----- РЕДАКТОР ТЕКСТА -----
    function openEditor(id) {
        const n = state.nodes.find(node => node.id === id);
        if (!n) return;
        document.getElementById('edit-textarea').value = n.content || '';
        document.getElementById('edit-modal').classList.add('show');
        document.getElementById('edit-textarea').focus();
        // Сохраняем id для сохранения
        document.getElementById('edit-modal').dataset.nodeId = id;
    }

    function saveEditor() {
        const id = parseInt(document.getElementById('edit-modal').dataset.nodeId);
        const n = state.nodes.find(node => node.id === id);
        if (n) {
            const val = document.getElementById('edit-textarea').value.trim();
            if (val) {
                n.content = val;
                if (state.bpmnActive) clearBPMN();
                render();
            }
        }
        document.getElementById('edit-modal').classList.remove('show');
    }

    function cancelEditor() {
        document.getElementById('edit-modal').classList.remove('show');
    }

    // ----- TOAST -----
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.display = 'none'; }, 1500);
    }

    // ----- СОБЫТИЯ КАНВАСА -----
    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    canvas.addEventListener('touchcancel', onEnd, { passive: false });

    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);

    // Двойной тап для редактирования (в режиме select)
    let lastTap = 0;
    canvas.addEventListener('click', function(e) {
        if (state.tool !== 'select') return;
        const now = Date.now();
        if (now - lastTap < 300) {
            const pos = getPos(e);
            const hit = getNodeAt(pos);
            if (hit) {
                openEditor(hit.id);
            }
            lastTap = 0;
        } else {
            lastTap = now;
        }
    });

    // ----- МОДАЛКА -----
    document.getElementById('edit-save').addEventListener('click', saveEditor);
    document.getElementById('edit-cancel').addEventListener('click', cancelEditor);
    document.getElementById('edit-textarea').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            saveEditor();
        }
        if (e.key === 'Escape') cancelEditor();
    });

    // ----- КНОПКИ ИНСТРУМЕНТОВ -----
    function setTool(tool) {
        state.tool = tool;
        document.querySelectorAll('.group button.tool-active').forEach(b => b.classList.remove('tool-active'));
        const btn = document.getElementById('tool-' + tool);
        if (btn) btn.classList.add('tool-active');
        state.selectedNodeId = null;
        render();
    }

    document.getElementById('tool-select').addEventListener('click', () => setTool('select'));
    document.getElementById('tool-node').addEventListener('click', () => setTool('node'));
    document.getElementById('tool-edge').addEventListener('click', () => setTool('edge'));
    document.getElementById('tool-delete').addEventListener('click', () => setTool('delete'));

    // ----- КНОПКИ РЕЖИМОВ -----
    document.getElementById('btn-graph').addEventListener('click', function() {
        state.viewMode = 'graph';
        if (state.bpmnActive) clearBPMN();
        document.querySelectorAll('#toolbar .group button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
    document.getElementById('btn-todo').addEventListener('click', function() {
        state.viewMode = 'todo';
        if (state.bpmnActive) clearBPMN();
        document.querySelectorAll('#toolbar .group button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
    document.getElementById('btn-text').addEventListener('click', function() {
        state.viewMode = 'text';
        if (state.bpmnActive) clearBPMN();
        document.querySelectorAll('#toolbar .group button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });

    document.getElementById('btn-bpmn').addEventListener('click', function() {
        if (state.bpmnActive) {
            clearBPMN();
        } else {
            applyBPMN();
        }
        render();
    });

    // ----- ЭКСПОРТ/ИМПОРТ -----
    document.getElementById('btn-export').addEventListener('click', function() {
        const data = {
            nodes: state.nodes,
            edges: state.edges,
            nextId: state.nextId,
            viewMode: state.viewMode
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'graph-' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('💾 Экспортировано');
    });

    document.getElementById('btn-import').addEventListener('click', function() {
        document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.nodes && data.edges !== undefined) {
                    state.nodes = data.nodes || [];
                    state.edges = data.edges || [];
                    state.nextId = data.nextId || 1;
                    if (data.viewMode) state.viewMode = data.viewMode;
                    if (state.bpmnActive) clearBPMN();
                    // Обновляем активные кнопки
                    document.querySelectorAll('#toolbar .group button').forEach(b => b.classList.remove('active'));
                    if (state.viewMode === 'graph') document.getElementById('btn-graph').classList.add('active');
                    else if (state.viewMode === 'todo') document.getElementById('btn-todo').classList.add('active');
                    else if (state.viewMode === 'text') document.getElementById('btn-text').classList.add('active');
                    render();
                    showToast('📂 Импортировано');
                }
            } catch(err) { alert('Ошибка при загрузке JSON'); }
        };
        reader.readAsText(file);
        this.value = '';
    });

    // ----- ДЕМО-ЗАМЕТКА (если нет сохранённых данных) -----
    function initDemo() {
        if (loadState()) {
            // Уже есть сохранённые данные
            render();
            return;
        }

        // Создаём демо-граф
        state.nodes = [
            { id: state.nextId++, x: 120, y: 160, content: 'Начало: заказ' },
            { id: state.nextId++, x: 340, y: 200, content: 'Оплата счёта' },
            { id: state.nextId++, x: 220, y: 380, content: 'Решение: проверка' },
            { id: state.nextId++, x: 440, y: 400, content: 'Доставка' },
            { id: state.nextId++, x: 180, y: 540, content: 'Конец: готово' }
        ];
        state.edges = [
            { id: state.nextId++, from: 1, to: 2, type: 'logical' },
            { id: state.nextId++, from: 2, to: 3, type: 'logical' },
            { id: state.nextId++, from: 3, to: 4, type: 'logical' },
            { id: state.nextId++, from: 4, to: 5, type: 'logical' }
        ];
        state.viewMode = 'graph';
        state.hasDemo = true;
        saveState();
        render();
        showToast('📖 Демо-граф загружен. Редактируй!');
    }

    // ----- СТАРТ -----
    window.addEventListener('resize', resize);
    resize();
    initDemo();

    // Активируем select-инструмент по умолчанию
    document.getElementById('tool-select').classList.add('tool-active');
    document.getElementById('btn-graph').classList.add('active');

    console.log('✅ Graph Editor готов!');
    console.log('🛠️ Инструменты: Выбрать (🖱️), Узел (✏️), Связь (🔗), Удалить (🗑️)');
    console.log('💾 Данные автоматически сохраняются в localStorage');
})();
</script>
</body>
</html>
