<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Graph — заметки как графы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0b0b0e;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            color: #eee;
        }
        #toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: #1a1a1f;
            border-bottom: 1px solid #2a2a30;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #toolbar button {
            background: #2c2c35;
            border: none;
            color: #ddd;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
            white-space: nowrap;
        }
        #toolbar button:active { background: #3d3d4a; transform: scale(0.95); }
        #toolbar button.active { background: #5a4b8a; color: #fff; }
        #toolbar .spacer { flex: 1; }
        #toolbar .note-title {
            color: #aaa;
            font-size: 13px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            width: 200px;
            background: #111116;
            border-right: 1px solid #1e1e24;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 8px;
            display: none;
        }
        #sidebar .note-item {
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
            transition: 0.1s;
        }
        #sidebar .note-item:hover { background: #1e1e26; }
        #sidebar .note-item.active { background: #2a2a3a; color: #fff; }
        #sidebar .note-item .badge {
            font-size: 10px;
            background: #2a2a3a;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }
        #canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #121216;
            touch-action: none;
        }
        #canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #status {
            padding: 4px 14px;
            background: #0f0f12;
            border-top: 1px solid #1a1a20;
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #1e1e26;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
        }
        .modal-box textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #eee;
            font-size: 15px;
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: flex-end;
        }
        .modal-box .actions button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }
        .modal-box .actions .save { background: #5a4b8a; color: #fff; }
        .modal-box .actions .cancel { background: #2a2a30; color: #aaa; }
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2a;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            color: #ddd;
            border: 1px solid #3a3a4a;
            display: none;
            z-index: 50;
        }
        @media (max-width: 600px) {
            #sidebar { width: 160px; }
            #toolbar button { font-size: 11px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="btn-sidebar">📋</button>
    <span class="note-title" id="note-title">Выберите заметку</span>
    <span class="spacer"></span>
    <button id="btn-text">📄</button>
    <button id="btn-todo">☑️</button>
    <button id="btn-graph" class="active">🌐</button>
    <button id="btn-meta">🔗</button>
    <button id="btn-new">➕</button>
</div>

<div id="main">
    <div id="sidebar"></div>
    <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
    </div>
</div>

<div id="status">
    <span id="node-count">Узлов: 0</span>
    <span id="edge-count">Связей: 0</span>
    <span id="view-label">режим: граф</span>
    <span id="meta-label"></span>
</div>

<div id="toast"></div>

<!-- Модалка редактирования узла -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
        <textarea id="edit-textarea" placeholder="Текст узла..."></textarea>
        <div class="actions">
            <button class="cancel" id="edit-cancel">Отмена</button>
            <button class="save" id="edit-save">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модалка новой заметки -->
<div class="modal-overlay" id="new-modal">
    <div class="modal-box">
        <textarea id="new-textarea" placeholder="Введите текст заметки..."></textarea>
        <div class="actions">
            <button class="cancel" id="new-cancel">Отмена</button>
            <button class="save" id="new-save">Создать</button>
        </div>
    </div>
</div>

<script>
(function(){
    // ----- СОСТОЯНИЕ ПРИЛОЖЕНИЯ -----
    let state = {
        notes: [],
        currentNoteId: null,
        viewMode: 'graph', // 'text' | 'todo' | 'graph' | 'meta'
        selectedNodeId: null,
        nextId: 1,
        metaGraph: {
            nodes: [],
            edges: []
        },
        sidebarOpen: true
    };

    // ----- ДЕМО-ЗАМЕТКИ (классические рыбы) -----
    const DEMO_NOTES = [
        {
            id: 1,
            title: 'Лиса',
            content: 'The quick brown fox jumps over the lazy dog. Это классическая панграмма, содержащая все буквы английского алфавита.'
        },
        {
            id: 2,
            title: 'Аэрофотосъёмка',
            content: 'Аэрофотосъёмка ландшафта уже показала, что земля — это не просто поверхность, а сложная система взаимосвязей.'
        },
        {
            id: 3,
            title: 'Lorem Ipsum',
            content: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.'
        },
        {
            id: 4,
            title: 'Мысли',
            content: 'Мысль — это связь. Одна мысль тянет за собой другую. Ассоциации рождают идеи. Идеи становятся действиями.'
        }
    ];

    // ----- ЗАГРУЗКА / СОХРАНЕНИЕ -----
    function loadState() {
        try {
            const saved = localStorage.getItem('graph_app_state');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.notes = parsed.notes || [];
                state.currentNoteId = parsed.currentNoteId || null;
                state.viewMode = parsed.viewMode || 'graph';
                state.metaGraph = parsed.metaGraph || { nodes: [], edges: [] };
                state.nextId = parsed.nextId || 1;
                if (state.notes.length === 0) initDemoNotes();
                return true;
            }
        } catch(e) {}
        return false;
    }

    function saveState() {
        const data = {
            notes: state.notes,
            currentNoteId: state.currentNoteId,
            viewMode: state.viewMode,
            metaGraph: state.metaGraph,
            nextId: state.nextId
        };
        localStorage.setItem('graph_app_state', JSON.stringify(data));
    }

    function initDemoNotes() {
        state.notes = DEMO_NOTES.map(n => ({
            ...n,
            graph: {
                enabled: false,
                nodes: [],
                edges: []
            },
            todos: []
        }));
        state.currentNoteId = state.notes[0]?.id || null;
        // Автоматически строим граф для первой заметки
        const first = state.notes[0];
        if (first) buildGraphFromText(first);
        saveState();
    }

    // ----- ПОСТРОЕНИЕ ГРАФА ИЗ ТЕКСТА -----
    function buildGraphFromText(note) {
        const words = note.content.split(/[.\s,;!?()"']+/).filter(w => w.length > 2);
        const uniqueWords = [...new Set(words)].slice(0, 12); // максимум 12 узлов
        
        const nodes = uniqueWords.map((word, i) => ({
            id: state.nextId++,
            text: word,
            x: 80 + (i % 4) * 90 + Math.random() * 20,
            y: 80 + Math.floor(i / 4) * 90 + Math.random() * 20
        }));

        const edges = [];
        for (let i = 0; i < nodes.length - 1; i++) {
            edges.push({
                id: state.nextId++,
                from: nodes[i].id,
                to: nodes[i+1].id,
                type: 'logical'
            });
        }

        note.graph = {
            enabled: true,
            nodes: nodes,
            edges: edges
        };
        saveState();
        return note;
    }

    // ----- ПОЛУЧЕНИЕ ТЕКУЩЕЙ ЗАМЕТКИ -----
    function getCurrentNote() {
        return state.notes.find(n => n.id === state.currentNoteId) || null;
    }

    // ----- КАНВАС -----
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
        const wrap = document.getElementById('canvas-wrap');
        W = wrap.clientWidth;
        H = wrap.clientHeight;
        canvas.width = W * devicePixelRatio;
        canvas.height = H * devicePixelRatio;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.scale(devicePixelRatio, devicePixelRatio);
        render();
    }

    // ----- ЭМОДЗИ ПО ТЕКСТУ -----
    const EMOJI_MAP = {
        'fox': '🦊', 'brown': '🟫', 'quick': '⚡',
        'аэро': '🛩️', 'земля': '🌍', 'система': '⚙️',
        'lorem': '📝', 'ipsum': '📝', 'dolor': '💭',
        'мысль': '💡', 'идея': '💡', 'связь': '🔗',
        'начало': '🟢', 'старт': '🟢',
        'конец': '🔴', 'финиш': '🔴',
        'решение': '🔶', 'если': '🔶',
        'задача': '📋', 'task': '📋'
    };

    function getEmoji(text) {
        if (!text) return '🔹';
        const lower = text.toLowerCase();
        for (const [word, emoji] of Object.entries(EMOJI_MAP)) {
            if (lower.includes(word)) return emoji;
        }
        return '🔹';
    }

    // ----- РЕНДЕРИНГ -----
    function render() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#121216';
        ctx.fillRect(0, 0, W, H);

        const note = getCurrentNote();

        if (state.viewMode === 'meta') {
            drawMetaGraph();
        } else if (note && note.graph && note.graph.enabled && state.viewMode === 'graph') {
            drawGraph(note);
        } else if (note && state.viewMode === 'todo') {
            drawTodo(note);
        } else if (note && state.viewMode === 'text') {
            drawText(note);
        } else {
            drawEmptyState();
        }

        // Обновление статуса
        if (note) {
            document.getElementById('node-count').textContent = 'Узлов: ' + (note.graph?.nodes?.length || 0);
            document.getElementById('edge-count').textContent = 'Связей: ' + (note.graph?.edges?.length || 0);
            document.getElementById('note-title').textContent = note.title || 'Без названия';
        } else {
            document.getElementById('node-count').textContent = 'Узлов: 0';
            document.getElementById('edge-count').textContent = 'Связей: 0';
            document.getElementById('note-title').textContent = 'Нет заметок';
        }
        document.getElementById('view-label').textContent = 'режим: ' + state.viewMode;
        document.getElementById('meta-label').textContent = state.viewMode === 'meta' ? '🌐 внешний граф' : '';

        saveState();
    }

    function drawGraph(note) {
        const g = note.graph;
        if (!g || !g.nodes) return;

        // Рёбра
        ctx.lineWidth = 2;
        for (const e of g.edges) {
            const from = g.nodes.find(n => n.id === e.from);
            const to = g.nodes.find(n => n.id === e.to);
            if (!from || !to) continue;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.setLineDash(e.type === 'mystery' ? [6, 6] : []);
            ctx.strokeStyle = e.type === 'mystery' ? '#aa88ff' : '#5588dd';
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Узлы
        for (const n of g.nodes) {
            const r = 26;
            const emoji = getEmoji(n.text);
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = state.selectedNodeId === n.id ? '#2a3a5a' : '#2a2a35';
            ctx.fill();
            ctx.strokeStyle = state.selectedNodeId === n.id ? '#88ddff' : '#5a6a8a';
            ctx.lineWidth = state.selectedNodeId === n.id ? 3 : 2;
            ctx.stroke();

            ctx.font = '18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.fillText(emoji, n.x, n.y - 14);

            ctx.font = '10px system-ui, sans-serif';
            ctx.fillStyle = '#ccc';
            const label = (n.text || 'узел').slice(0, 14) + ((n.text || '').length > 14 ? '…' : '');
            ctx.fillText(label, n.x, n.y + 18);
        }
    }

    function drawTodo(note) {
        const items = note.todos && note.todos.length > 0 ? note.todos : 
            note.content.split('\n').filter(l => l.trim()).map((l, i) => ({ id: i, text: l, done: false }));
        const startY = 60;
        let y = startY;
        ctx.fillStyle = '#eaeaea';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textBaseline = 'top';
        for (const item of items) {
            ctx.fillStyle = item.done ? '#666' : '#c8c8d0';
            ctx.fillText((item.done ? '✅' : '○') + ' ' + (item.text || 'пусто'), 30, y);
            y += 40;
            if (y > H - 40) break;
        }
        if (items.length === 0) {
            ctx.fillStyle = '#444';
            ctx.fillText('Нет пунктов. Переключись в Текст и добавь.', 30, startY);
        }
    }

    function drawText(note) {
        const startY = 60;
        ctx.fillStyle = '#d0d0da';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textBaseline = 'top';
        const lines = note.content.split('\n');
        let y = startY;
        for (const line of lines) {
            if (y > H - 40) break;
            ctx.fillStyle = '#d0d0da';
            ctx.fillText(line || ' ', 24, y);
            y += 28;
        }
        if (!note.content) {
            ctx.fillStyle = '#444';
            ctx.fillText('Пустая заметка. Нажми ✏️ чтобы редактировать.', 24, startY);
        }
    }

    function drawMetaGraph() {
        const meta = state.metaGraph;
        // Рёбра между заметками
        for (const e of meta.edges) {
            const from = meta.nodes.find(n => n.id === e.from);
            const to = meta.nodes.find(n => n.id === e.to);
            if (!from || !to) continue;
            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);
            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // Узлы — заметки
        for (const n of meta.nodes) {
            const note = state.notes.find(no => no.id === n.noteId);
            if (!note) continue;
            const r = 30;
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#2a2a35';
            ctx.fill();
            ctx.strokeStyle = '#5a6a8a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = '14px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#eee';
            const label = (note.title || 'заметка').slice(0, 12);
            ctx.fillText(label, n.x, n.y);
        }

        if (meta.nodes.length === 0) {
            ctx.fillStyle = '#444';
            ctx.font = '16px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Нет связей между заметками. Создайте заметки и свяжите их.', W/2, H/2);
        }
    }

    function drawEmptyState() {
        ctx.fillStyle = '#444';
        ctx.font = '16px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Создайте заметку или выберите существующую', W/2, H/2);
    }

    // ----- ВЗАИМОДЕЙСТВИЕ С ХОЛСТОМ -----
    let dragTarget = null;
    let dragOffsetX = 0, dragOffsetY = 0;
    let edgeStartNode = null;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return {
            x: (t.clientX - rect.left) * (W / rect.width),
            y: (t.clientY - rect.top) * (H / rect.height)
        };
    }

    function getNodeAt(pos, nodes) {
        return nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 30);
    }

    function onStart(e) {
        e.preventDefault();
        const pos = getPos(e);
        const note = getCurrentNote();

        if (state.viewMode === 'meta') {
            // Внешний граф
            const hit = getNodeAt(pos, state.metaGraph.nodes);
            if (hit) {
                const note = state.notes.find(n => n.id === hit.noteId);
                if (note) {
                    state.currentNoteId = note.id;
                    state.viewMode = 'graph';
                    render();
                    updateSidebar();
                    showToast('📂 Открыта: ' + note.title);
                }
            }
            return;
        }

        if (!note || !note.graph || !note.graph.enabled || state.viewMode !== 'graph') return;

        const g = note.graph;
        const hit = getNodeAt(pos, g.nodes);

        if (hit) {
            state.selectedNodeId = hit.id;
            dragTarget = hit;
            dragOffsetX = pos.x - hit.x;
            dragOffsetY = pos.y - hit.y;
            render();
        } else {
            state.selectedNodeId = null;
            // Начинаем рисование связи
            edgeStartNode = null;
            // Проверяем, не начали ли тянуть от существующего узла
            const near = g.nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 40);
            if (near) {
                edgeStartNode = near;
                state.selectedNodeId = near.id;
                render();
            }
        }
    }

    function onMove(e) {
        e.preventDefault();
        const pos = getPos(e);

        if (state.viewMode === 'meta') {
            // Перетаскивание узлов внешнего графа
            const hit = state.metaGraph.nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 30);
            if (hit && dragTarget) {
                hit.x = Math.min(W - 10, Math.max(10, pos.x - dragOffsetX));
                hit.y = Math.min(H - 10, Math.max(10, pos.y - dragOffsetY));
                render();
            }
            return;
        }

        const note = getCurrentNote();
        if (!note || !note.graph || !note.graph.enabled || state.viewMode !== 'graph') return;

        const g = note.graph;

        if (dragTarget) {
            dragTarget.x = Math.min(W - 10, Math.max(10, pos.x - dragOffsetX));
            dragTarget.y = Math.min(H - 10, Math.max(10, pos.y - dragOffsetY));
            render();
        }

        // Визуализация рисования связи
        if (edgeStartNode) {
            render();
            ctx.beginPath();
            ctx.moveTo(edgeStartNode.x, edgeStartNode.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = '#88aadd88';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    function onEnd(e) {
        e.preventDefault();
        const pos = getPos(e);
        const note = getCurrentNote();

        if (state.viewMode === 'meta') {
            dragTarget = null;
            return;
        }

        if (!note || !note.graph || !note.graph.enabled || state.viewMode !== 'graph') {
            dragTarget = null;
            edgeStartNode = null;
            return;
        }

        const g = note.graph;

        // Завершение рисования связи
        if (edgeStartNode) {
            const hit = getNodeAt(pos, g.nodes);
            if (hit && hit.id !== edgeStartNode.id) {
                g.edges.push({
                    id: state.nextId++,
                    from: edgeStartNode.id,
                    to: hit.id,
                    type: 'logical'
                });
                showToast('🔗 Связь создана');
                saveState();
            }
            edgeStartNode = null;
            state.selectedNodeId = null;
            render();
        }

        dragTarget = null;
    }

    // ----- ДВОЙНОЙ ТАП ДЛЯ РЕДАКТИРОВАНИЯ УЗЛА -----
    let lastTap = 0;
    canvas.addEventListener('click', function(e) {
        const note = getCurrentNote();
        if (!note || !note.graph || !note.graph.enabled || state.viewMode !== 'graph') return;

        const now = Date.now();
        if (now - lastTap < 300) {
            const pos = getPos(e);
            const hit = getNodeAt(pos, note.graph.nodes);
            if (hit) {
                openEditor(hit.id);
            }
            lastTap = 0;
        } else {
            lastTap = now;
        }
    });

    // ----- СОБЫТИЯ КАНВАСА -----
    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    canvas.addEventListener('touchcancel', onEnd, { passive: false });

    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);

    // ----- РЕДАКТОР УЗЛА -----
    function openEditor(nodeId) {
        const note = getCurrentNote();
        if (!note || !note.graph) return;
        const node = note.graph.nodes.find(n => n.id === nodeId);
        if (!node) return;
        document.getElementById('edit-textarea').value = node.text || '';
        document.getElementById('edit-modal').dataset.nodeId = nodeId;
        document.getElementById('edit-modal').classList.add('show');
        document.getElementById('edit-textarea').focus();
    }

    function saveEditor() {
        const note = getCurrentNote();
        if (!note || !note.graph) return;
        const nodeId = parseInt(document.getElementById('edit-modal').dataset.nodeId);
        const node = note.graph.nodes.find(n => n.id === nodeId);
        if (node) {
            const val = document.getElementById('edit-textarea').value.trim();
            if (val) {
                node.text = val;
                // Обновляем content заметки (синхронизация)
                updateNoteContentFromGraph(note);
                saveState();
                render();
                showToast('✅ Узел обновлён');
            }
        }
        document.getElementById('edit-modal').classList.remove('show');
    }

    function cancelEditor() {
        document.getElementById('edit-modal').classList.remove('show');
    }

    function updateNoteContentFromGraph(note) {
        if (!note.graph || !note.graph.nodes) return;
        // Собираем текст из узлов в порядке их создания или по координатам
        const sorted = [...note.graph.nodes].sort((a, b) => a.y - b.y || a.x - b.x);
        note.content = sorted.map(n => n.text).join(' ');
    }

    // ----- МОДАЛКА НОВОЙ ЗАМЕТКИ -----
    function openNewNote() {
        document.getElementById('new-textarea').value = '';
        document.getElementById('new-modal').classList.add('show');
        document.getElementById('new-textarea').focus();
    }

    function saveNewNote() {
        const val = document.getElementById('new-textarea').value.trim();
        if (!val) {
            showToast('⚠️ Введите текст заметки');
            return;
        }
        const title = val.split('\n')[0].slice(0, 30) || 'Заметка';
        const note = {
            id: state.nextId++,
            title: title,
            content: val,
            graph: { enabled: false, nodes: [], edges: [] },
            todos: []
        };
        state.notes.push(note);
        state.currentNoteId = note.id;
        // Строим граф автоматически
        buildGraphFromText(note);
        document.getElementById('new-modal').classList.remove('show');
        updateSidebar();
        render();
        showToast('✅ Заметка создана: ' + title);
        saveState();
    }

    function cancelNewNote() {
        document.getElementById('new-modal').classList.remove('show');
    }

    // ----- САЙДБАР -----
    function updateSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';
        for (const note of state.notes) {
            const div = document.createElement('div');
            div.className = 'note-item' + (note.id === state.currentNoteId ? ' active' : '');
            div.textContent = note.title || 'Без названия';
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = note.graph?.enabled ? '🌐' : '📄';
            div.appendChild(badge);
            div.addEventListener('click', () => {
                state.currentNoteId = note.id;
                state.viewMode = 'graph';
                updateSidebar();
                render();
                showToast('📂 ' + note.title);
            });
            sidebar.appendChild(div);
        }
        if (state.notes.length === 0) {
            const div = document.createElement('div');
            div.className = 'note-item';
            div.textContent = '➕ Создайте заметку';
            div.style.color = '#555';
            sidebar.appendChild(div);
        }
    }

    // ----- TOAST -----
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.display = 'none'; }, 1500);
    }

    // ----- КНОПКИ -----
    document.getElementById('btn-sidebar').addEventListener('click', function() {
        const sidebar = document.getElementById('sidebar');
        state.sidebarOpen = !state.sidebarOpen;
        sidebar.style.display = state.sidebarOpen ? 'block' : 'none';
    });

    document.getElementById('btn-new').addEventListener('click', openNewNote);

    document.getElementById('btn-text').addEventListener('click', function() {
        state.viewMode = 'text';
        document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
    document.getElementById('btn-todo').addEventListener('click', function() {
        state.viewMode = 'todo';
        document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
    document.getElementById('btn-graph').addEventListener('click', function() {
        state.viewMode = 'graph';
        document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });
    document.getElementById('btn-meta').addEventListener('click', function() {
        state.viewMode = 'meta';
        // Автоматически строим внешний граф, если его нет
        if (state.metaGraph.nodes.length === 0 && state.notes.length > 1) {
            buildMetaGraph();
        }
        document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        render();
    });

    function buildMetaGraph() {
        const nodes = state.notes.map((note, i) => ({
            id: state.nextId++,
            noteId: note.id,
            x: 100 + (i % 3) * 180 + Math.random() * 30,
            y: 100 + Math.floor(i / 3) * 180 + Math.random() * 30
        }));
        const edges = [];
        for (let i = 0; i < nodes.length - 1; i++) {
            edges.push({
                id: state.nextId++,
                from: nodes[i].id,
                to: nodes[i+1].id,
                type: 'relates'
            });
        }
        state.metaGraph = { nodes, edges };
        saveState();
    }

    // ----- МОДАЛКИ -----
    document.getElementById('edit-save').addEventListener('click', saveEditor);
    document.getElementById('edit-cancel').addEventListener('click', cancelEditor);
    document.getElementById('edit-textarea').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEditor(); }
        if (e.key === 'Escape') cancelEditor();
    });

    document.getElementById('new-save').addEventListener('click', saveNewNote);
    document.getElementById('new-cancel').addEventListener('click', cancelNewNote);
    document.getElementById('new-textarea').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.ctrlKey) { saveNewNote(); }
        if (e.key === 'Escape') cancelNewNote();
    });

    // ----- СТАРТ -----
    window.addEventListener('resize', resize);
    
    if (!loadState()) {
        initDemoNotes();
    }
    
    // Открываем первую заметку, если ни одна не выбрана
    if (!state.currentNoteId && state.notes.length > 0) {
        state.currentNoteId = state.notes[0].id;
    }

    // Включаем граф для текущей заметки, если ещё не включён
    const current = getCurrentNote();
    if (current && !current.graph?.enabled) {
        buildGraphFromText(current);
    }

    updateSidebar();
    resize();
    document.getElementById('btn-graph').classList.add('active');
    document.getElementById('sidebar').style.display = state.sidebarOpen ? 'block' : 'none';

    console.log('✅ Graph v2 готов!');
    console.log('📝 Заметки -> Граф -> Внешний граф');
    console.log('🔄 Двойной тап по узлу — редактировать');
    console.log('🔗 Тяни от узла к узлу — создать связь');
})();
</script>
</body>
</html>
